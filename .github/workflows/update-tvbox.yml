name: Update TVBox config

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate merged config
        run: |
          python update_tvbox_config.py
          python -m json.tool jsm.json > /dev/null
          cp jsm.json tvbox.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jsm.json tvbox.json js/xiaoman-douyin.js TVBox/douyin_cookie.txt
          if ! git diff --cached --quiet; then
            git commit -m "auto update tvbox jsm"
            git push
          fi
